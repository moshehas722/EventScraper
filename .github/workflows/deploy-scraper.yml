name: Deploy scraper

on:
  push:
    branches: [master]
    paths-ignore:
      - 'web/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build image
        run: docker build -t eventscraper-scraper .

      - name: Restart container
        run: |
          docker stop eventscraper-scraper || true
          docker rm eventscraper-scraper || true
          docker run -d \
            --name eventscraper-scraper \
            --restart unless-stopped \
            -p 3001:3001 \
            --env-file /etc/eventscraper-secrets/eventscraper.env \
            eventscraper-scraper

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 2
          done
          echo "Scraper API did not become healthy" >&2
          exit 1
