name: Deploy scraper

on:
  push:
    branches: [master]
    paths-ignore:
      - 'web/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build image
        run: docker build -t eventscraper-scraper .

      - name: Ensure WhatsApp plugin network exists
        # whatapp-agent-net is external (owned by the whatappAgent project, not
        # this one) so the two projects can deploy independently — see
        # whatappAgent's README. Idempotent: no-op if it already exists.
        run: docker network create whatapp-agent-net 2>/dev/null || true

      - name: Restart container
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_STORE_ID: ${{ secrets.BLOB_STORE_ID }}
          WHATSAPP_MAIN_SERVICE_URL: ${{ secrets.WHATSAPP_MAIN_SERVICE_URL }}
          WHATSAPP_PLUGIN_BASE_URL: ${{ secrets.WHATSAPP_PLUGIN_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker stop eventscraper-scraper || true
          docker rm eventscraper-scraper || true
          docker run -d \
            --name eventscraper-scraper \
            --restart unless-stopped \
            --network whatapp-agent-net \
            -p 3001:3001 \
            -e PORT=3001 \
            -e BLOB_READ_WRITE_TOKEN \
            -e BLOB_STORE_ID \
            -e WHATSAPP_MAIN_SERVICE_URL \
            -e WHATSAPP_PLUGIN_BASE_URL \
            -e GEMINI_API_KEY \
            eventscraper-scraper

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 2
          done
          echo "Scraper API did not become healthy" >&2
          exit 1
